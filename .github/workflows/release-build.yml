name: Build release applications

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install FuzzToolBox and build dependencies
        run: python -m pip install ".[gui]" "pyinstaller>=6,<7"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Ensure Inno Setup is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
          }

      - name: Smoke-test GUI initialization
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from fuzztoolbox.app import MainWindow; app = QApplication([]); window = MainWindow(); window.close(); app.processEvents()"

      - name: Build native application and archive
        run: python packaging/build_release.py

      - name: Verify Windows executable icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path 'build/FuzzToolBox/FuzzToolBox.exe').Path
          $ico = (Resolve-Path 'packaging/FuzzToolBox.ico').Path
          $actualIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $actualIcon) { throw 'Windows executable has no associated icon' }
          $expectedIcon = [System.Drawing.Icon]::new($ico, $actualIcon.Width, $actualIcon.Height)
          $actual = $actualIcon.ToBitmap()
          $expected = $expectedIcon.ToBitmap()
          $different = 0
          for ($x = 0; $x -lt $actual.Width; $x++) {
            for ($y = 0; $y -lt $actual.Height; $y++) {
              if ($actual.GetPixel($x, $y).ToArgb() -ne $expected.GetPixel($x, $y).ToArgb()) {
                $different++
              }
            }
          }
          $actual.Dispose()
          $expected.Dispose()
          $actualIcon.Dispose()
          $expectedIcon.Dispose()
          if ($different -ne 0) { throw "Embedded executable icon differs at $different pixels" }
          Write-Host 'Custom Windows executable icon verified.'

      - name: Upload release asset directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "Targeting release/tag: $tag"
          upload_files=$(find build/releases -maxdepth 1 -type f | sort)
          if [ -z "$upload_files" ]; then
            echo "ERROR: No build artifacts found in build/releases/"
            exit 1
          fi
          echo "Uploading: $upload_files"
          gh release upload "$tag" $upload_files --clobber --repo "$GH_REPO"

  verify:
    name: Verify release assets
    if: github.event_name != 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify both platform assets exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -eu
          tag="${{ github.event.release.tag_name }}"
          echo "Verifying assets for tag: $tag"
          echo "Assets currently on release:"
          gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[] | "  \(.name)  (\(.size) bytes)"'
          asset_count=$(gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets | length')
          echo "Total assets: $asset_count"
          if [ "$asset_count" -lt 2 ]; then
            echo "ERROR: Expected at least 2 release assets, found $asset_count"
            gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[].name'
            exit 1
          fi
          echo "All platform assets present in release."