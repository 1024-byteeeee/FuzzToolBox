name: Build release applications

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag whose assets should be replaced
        required: true
        default: 2.1.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install FuzzToolBox and build dependencies
        run: python -m pip install ".[dev]"

      - name: Run Ruff static checks
        run: python -m ruff check .

      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -e
          python -m pytest -q tests --ignore=tests/ui
          for test_file in tests/ui/test_*.py; do
            python -m pytest -q "$test_file"
          done

      - name: Ensure Inno Setup is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
          }

      - name: Smoke-test GUI initialization
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from fuzztoolbox.app import MainWindow; app = QApplication([]); window = MainWindow(); window.close(); app.processEvents()"

      - name: Build native application and archive
        run: python packaging/build_release.py

      - name: Smoke-test frozen Windows startup and single-instance behavior
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: >-
          python tests/native/frozen_app_smoke.py
          --application build/FuzzToolBox/FuzzToolBox.exe
          --startup-timeout 45

      - name: Smoke-test frozen macOS startup and single-instance behavior
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: >-
          python tests/native/frozen_app_smoke.py
          --application build/FuzzToolBox.app
          --startup-timeout 45

      - name: Verify Windows executable icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path 'build/FuzzToolBox/FuzzToolBox.exe').Path
          $ico = (Resolve-Path 'packaging/FuzzToolBox.ico').Path
          $actualIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $actualIcon) { throw 'Windows executable has no associated icon' }
          $expectedIcon = [System.Drawing.Icon]::new($ico, $actualIcon.Width, $actualIcon.Height)
          $actual = $actualIcon.ToBitmap()
          $expected = $expectedIcon.ToBitmap()
          $different = 0
          for ($x = 0; $x -lt $actual.Width; $x++) {
            for ($y = 0; $y -lt $actual.Height; $y++) {
              if ($actual.GetPixel($x, $y).ToArgb() -ne $expected.GetPixel($x, $y).ToArgb()) {
                $different++
              }
            }
          }
          $actual.Dispose()
          $expected.Dispose()
          $actualIcon.Dispose()
          $expectedIcon.Dispose()
          if ($different -ne 0) { throw "Embedded executable icon differs at $different pixels" }
          Write-Host 'Custom Windows executable icon verified.'

      - name: Upload release asset directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.release_tag }}"
          fi
          echo "Targeting release/tag: $tag"
          if [ "${{ runner.os }}" = "macOS" ]; then
            gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                case "$asset" in
                  FuzzToolBox-macOS-*.dmg)
                    gh release delete-asset "$tag" "$asset" --yes --repo "$GH_REPO"
                    ;;
                esac
              done
          fi
          upload_files=$(find build/releases -maxdepth 1 -type f | sort)
          if [ -z "$upload_files" ]; then
            echo "ERROR: No build artifacts found in build/releases/"
            exit 1
          fi
          echo "Uploading: $upload_files"
          gh release upload "$tag" $upload_files --clobber --repo "$GH_REPO"

  verify:
    name: Verify release assets
    if: github.event_name != 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify both platform assets exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -eu
          tag="${{ github.event.release.tag_name }}"
          echo "Verifying assets for tag: $tag"
          echo "Assets currently on release:"
          gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[] | "  \(.name)  (\(.size) bytes)"'
          version="${tag#v}"
          assets=$(gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[].name')
          echo "$assets" | grep -qx "FuzzToolBox-v${version}-macOS-arm64.dmg"
          echo "$assets" | grep -qx "FuzzToolBox-v${version}-Windows-x86_64-Setup.exe"
          if echo "$assets" | grep -q '^FuzzToolBox-macOS-'; then
            echo "ERROR: Legacy unversioned macOS asset is still present"
            exit 1
          fi
          echo "All platform assets present in release."
