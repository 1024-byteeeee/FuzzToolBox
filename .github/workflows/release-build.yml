name: Build release applications

on:
  push:
    tags:
      - "*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller "PySide6>=6.5,<7"

      - name: Install IP-Scanner
        run: python -m pip install --no-deps .

      - name: Build native application and archive
        run: python packaging/build_release.py

      - name: Store workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IP-Scanner-${{ runner.os }}-${{ runner.arch }}
          path: build/releases/*
          if-no-files-found: error

      - name: Attach archive to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ github.ref_name }}"
          fi
          gh release upload "$tag" build/releases/* --clobber
