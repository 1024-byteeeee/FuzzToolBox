name: Build release applications

on:
  push:
    tags:
      - "*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install IP-Scanner and build dependencies
        run: python -m pip install ".[gui]" "pyinstaller>=6,<7"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test GUI initialization
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from ip_scanner.gui import MainWindow; app = QApplication([]); window = MainWindow(); window.close(); app.processEvents()"

      - name: Build native application and archive
        run: python packaging/build_release.py

      - name: Store workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IP-Scanner-${{ runner.os }}-${{ runner.arch }}
          path: build/releases/*
          if-no-files-found: error


  publish:
    name: Publish complete release set
    if: github.event_name != 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all native archives
        uses: actions/download-artifact@v4
        with:
          pattern: IP-Scanner-*
          path: build/releases
          merge-multiple: true

      - name: Verify complete platform set
        shell: bash
        run: |
          set -eu
          test "$(find build/releases -maxdepth 1 -type f | wc -l)" -eq 3
          ls -lh build/releases

      - name: Replace GitHub Release archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ github.ref_name }}"
          fi
          gh release view "$tag" >/dev/null
          gh release upload "$tag" build/releases/* --clobber
