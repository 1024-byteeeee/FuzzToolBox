[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-scanner"
version = "2.1.0"
description = "FuzzToolBox desktop IT toolbox with a responsive LAN IP scanner"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9,<8",
    "getmac>=0.9,<1",
    "dxpdf>=0.4,<0.5",
    "pypdf>=5,<7",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5,<7"]
dev = ["pytest>=7", "ruff>=0.5", "pyinstaller>=6,<7"]

[project.scripts]
ip-scanner = "ip_scanner.cli:main"
ip-scanner-gui = "ip_scanner.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ip_scanner = ["assets/*.svg", "assets/*.png", "assets/fonts/*.otf", "assets/fonts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py39"
