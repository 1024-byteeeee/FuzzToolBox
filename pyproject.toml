[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-scanner"
version = "0.1.1"
description = "A responsive cross-platform LAN IP scanner"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5,<7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
ip-scanner = "ip_scanner.cli:main"
ip-scanner-gui = "ip_scanner.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ip_scanner = ["assets/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py39"
