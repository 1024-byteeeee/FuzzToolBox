[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzztoolbox"
version = "2.1.0"
description = "FuzzToolBox desktop IT toolbox with a responsive LAN IP scanner"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9,<8",
    "getmac>=0.9,<1",
    "segno>=1.6,<2",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5,<7"]
dev = ["pytest>=7", "ruff>=0.5", "pyinstaller>=6,<7"]

[project.scripts]
fuzztoolbox = "fuzztoolbox.tools.ip_scanner.cli:main"
fuzztoolbox-gui = "fuzztoolbox.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuzztoolbox = [
    "assets/*.svg",
    "assets/*.png",
    "styles/*.qss",
    "runtime_scripts/windows/*.ps1",
]

[tool.ruff]
line-length = 100
target-version = "py39"
